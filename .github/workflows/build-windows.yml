name: Build Windows

# Manual run: Actions tab -> "Build Windows" -> Run workflow.
# Pushing a tag like v0.2.0 also attaches the zip + installer to that GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: pip install ".[gui]" pyinstaller
      - run: python packaging/build.py --installer
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\MusicMaid\MusicMaid.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:TEMP\musicmaid-selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: MusicMaid-windows, path: release/* }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: release/* }
