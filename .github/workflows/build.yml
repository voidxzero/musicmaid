name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools
      - run: pip install ".[all,dev]"
      - run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: pip install ".[gui]" pyinstaller
      - run: python packaging/build.py --installer
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\MusicMaid\MusicMaid.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:TEMP\musicmaid-selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: MusicMaid-windows, path: release/* }

  linux:
    needs: test
    # oldest supported runner -> binaries work on older distros too (glibc compatibility)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libfuse2
      - run: pip install ".[gui]" pyinstaller
      - run: python packaging/build.py --appimage
      - run: QT_QPA_PLATFORM=offscreen dist/MusicMaid/MusicMaid --self-test
      - uses: actions/upload-artifact@v4
        with: { name: MusicMaid-linux, path: release/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: release/* }
