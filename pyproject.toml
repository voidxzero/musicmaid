[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicmaid"
version = "0.3.1"
description = "Tag, clean up, de-duplicate and organize your music library (GUI, TUI and CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mutagen>=1.47",
    "requests>=2.31",
    "numpy>=2.0",
    "Pillow>=10",
    "send2trash>=1.8",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
tui = ["textual>=0.80"]
all = ["PySide6>=6.6", "textual>=0.80"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
musicmaid-cli = "musicmaid.cli:main"
musicmaid-tui = "musicmaid.tui.app:main"

[project.gui-scripts]
musicmaid = "musicmaid.__main__:main"

[tool.setuptools.packages.find]
include = ["musicmaid*"]

[tool.setuptools.package-data]
musicmaid = ["assets/*", "skins/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
